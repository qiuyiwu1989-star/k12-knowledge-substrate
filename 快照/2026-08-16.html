<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对账单</title>
<!--
  对账 · 渲染器

  每天只重写下面 <script id="账"> 里的 JSON，其余一个字不动。
  数据从 日志/YYYY-MM-DD.md 提取，不要靠回忆。提取规则见 SKILL.md。

  视觉：账簿。绿条纸、红字、代签盖章。
  改配色改 :root，不要改结构。
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF6;   /* 账簿纸 */
    --bar:#E9EEE2;     /* 绿条 */
    --ink:#15191B;     /* 蓝黑墨 */
    --ink2:#474E4C;
    --ink3:#7B827D;
    --rule:#C6CDBF;
    --red:#A32E22;     /* 红字：欠着的、代签的 */
    --blue:#23557E;    /* 校对蓝：后面推翻前面 */
    --olive:#4C5B3A;   /* 已结清 */
    --amber:#8E6A12;   /* 悬着、低确定性 */
    --gain:#2F6D5B;    /* 攒下的：正资产 */
    --mono:'Space Mono',ui-monospace,Menlo,monospace;
    --sans:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;
    --serif:'Noto Serif SC',Songti SC,serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.65}
  .sheet{max-width:1140px;margin:0 auto;padding:0 22px 90px 0;display:grid;grid-template-columns:36px 1fr}

  /* 装订边：账簿的骑缝 */
  .bind{border-right:1px solid var(--rule);position:relative}
  .bind::before{content:'';position:absolute;top:0;bottom:0;right:5px;border-right:1px solid var(--rule)}
  .bind span{position:sticky;top:26px;display:block;writing-mode:vertical-rl;font-family:var(--mono);
    font-size:9.5px;letter-spacing:.34em;color:var(--ink3);padding:26px 0 0 9px}
  .body{padding-left:26px;min-width:0}

  /* 抬头 */
  .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--red);padding-top:30px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:12px;margin-top:4px}
  h1{font-family:var(--serif);font-size:27px;font-weight:600;margin:0;letter-spacing:.01em}
  .when{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.55}
  .views{display:flex;margin-top:7px}
  .views button{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;background:transparent;
    color:var(--ink3);border:1px solid var(--rule);border-left-width:0;padding:5px 11px;cursor:pointer}
  .views button:first-child{border-left-width:1px}
  .views button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .views button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* 结余：一句话 */
  .balance{display:flex;gap:16px;margin:24px 0 26px}
  .balance i{flex:none;width:3px;background:var(--red)}
  .balance p{margin:0;font-family:var(--serif);font-size:19.5px;line-height:1.75;max-width:44ch}

  /* 数字带 */
  .tally{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ink);
    border-bottom:1px solid var(--ink);margin-bottom:8px}
  .tally div{padding:11px 0 10px 14px;border-left:1px solid var(--rule)}
  .tally div:first-child{border-left:0;padding-left:0}
  .tally b{display:block;font-family:var(--mono);font-weight:700;font-size:31px;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .tally span{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--ink3);display:block;margin-top:5px}
  .tally .owe b{color:var(--red)}
  .tally .dim b{color:var(--ink3)}
  .tally .gain b{color:var(--gain)}

  /* 区块 */
  section{margin-top:34px}
  h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;margin:0 0 3px;color:var(--ink);
    border-bottom:1px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h2 em{font-style:normal;font-family:var(--sans);font-size:12px;letter-spacing:0;color:var(--ink3);text-align:right;font-weight:400}
  h2.owe{color:var(--red);border-color:var(--red)}

  .cols{display:grid;grid-template-columns:1.06fr 1fr;gap:0 40px;align-items:start}
  .cols > div{min-width:0}

  /* 条目 */
  .entry{border-left:3px solid var(--rule);padding:13px 0 14px 15px;margin-top:14px;background:linear-gradient(90deg,rgba(0,0,0,.018),transparent 62%)}
  .entry.open{border-color:var(--amber);border-left-style:dashed}
  .entry.signed{border-color:var(--red)}
  .age{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;flex:none;padding-top:4px;color:var(--red)}
  .age.cold{color:var(--red);border-bottom:2px solid var(--red)}
  .entry .t{font-weight:500;font-size:15.5px;line-height:1.5}
  .entry p{margin:7px 0 0;font-size:13.5px;color:var(--ink2);line-height:1.6}
  .entry p.harm{color:var(--red)}
  .cost{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--amber);margin-top:6px;display:block}
  .head-row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}

  .forks{margin-top:10px;border-top:1px solid var(--rule)}
  .forks div{display:flex;gap:11px;padding:7px 0;border-bottom:1px solid var(--rule);font-size:13.5px;line-height:1.55}
  .forks b{font-family:var(--mono);font-size:10px;color:var(--amber);flex:none;padding-top:2px}

  /* 代签盖章 */
  .stamp{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--red);flex:none;
    border:1px solid var(--red);padding:3px 7px;transform:rotate(-5deg);white-space:nowrap;
    box-shadow:0 0 0 1.5px var(--paper),0 0 0 2.5px rgba(163,46,34,.32);margin-top:3px}

  /* 绿条纸列表 */
  ul.ledger{list-style:none;margin:6px 0 0;padding:0;border-bottom:1px solid var(--rule)}
  ul.ledger li{display:flex;gap:12px;padding:9px 10px 9px 8px;border-top:1px solid var(--rule);font-size:13.5px;line-height:1.55}
  ul.ledger li:nth-child(odd){background:var(--bar)}
  ul.ledger .no{font-family:var(--mono);font-size:10px;color:var(--ink3);flex:none;width:20px;padding-top:2px}
  ul.ledger .did{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px}
  ul.ledger .rule-out{display:block;margin-top:3px;color:var(--red);font-size:13px}
  ul.ledger .src{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:4px;display:block}
  ul.ledger .gain-in{display:block;margin-top:3px;color:var(--gain);font-size:13px}
  ul.ledger .filed{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink3);
    margin-top:5px;display:block;border-top:1px dotted var(--rule);padding-top:4px}
  ul.ledger .filed.up{color:var(--gain)}
  ul.ledger .filed.kill{color:var(--red)}
  h2.gain{color:var(--gain);border-color:var(--gain)}

  /* 流水 */
  .flow{width:100%;height:auto;display:block;margin-top:10px}
  .flow text{font-family:var(--mono);font-size:10.5px;fill:var(--ink3)}
  .flow text.ev{font-family:var(--sans);font-size:12px;fill:var(--ink2)}
  .key{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink3);margin-top:2px}
  .key i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:middle}

  /* 已结 */
  details summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;color:var(--ink3);
    padding:10px 0;cursor:pointer;border-bottom:1px solid var(--rule);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:'▸ ';color:var(--olive)}
  details[open] summary::before{content:'▾ '}
  details ul.ledger li{color:var(--ink2)}
  details ul.ledger .why{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}

  .next{border:1px solid var(--ink);padding:15px 17px;margin-top:14px;font-size:15px;line-height:1.7}
  .acts{display:flex;gap:9px;margin-top:11px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;background:transparent;color:var(--ink2);
    border:1px solid var(--rule);padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:var(--ink);color:var(--ink)}
  .btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .foot{margin-top:52px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink3);max-width:64ch;line-height:1.75}
  .foot code{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:9px 17px;display:none}

  @media(max-width:820px){
    .cols{grid-template-columns:1fr;gap:0}
    .tally{grid-template-columns:repeat(3,1fr)}
    .tally div{border-top:1px solid var(--rule);padding-left:12px}
    .tally div:nth-child(-n+3){border-top:0}
    .tally div:nth-child(4){border-left:0;padding-left:0}
    .tally b{font-size:26px}
    .balance p{font-size:17.5px}
    .sheet{grid-template-columns:20px 1fr;padding-right:16px}
    .body{padding-left:16px}
    .bind span{display:none}
  }
  @media print{
    .views,.acts,.toast{display:none}
    body{background:#fff}
    details{display:block}
  }
</style>
</head>

    {

  "时间轴": [

<div class="sheet">
  <div class="bind"><span>对账单 · RECONCILE</span></div>
  <div class="body">
    <div class="eyebrow">日终对账</div>
    <div class="top">
      <h1 id="项目"></h1>
      <div>
        <div class="when" id="日期"></div>
        <div class="views" role="group" aria-label="视角">
          <button type="button" data-view="日终" aria-pressed="true">日终 · 全账</button>
          <button type="button" data-view="开场" aria-pressed="false">开场 · 接班</button>
        </div>
      </div>
    </div>

    <div class="balance"><i></i><p id="结余"></p></div>
    <div class="tally" id="计数"></div>

    <div id="正文"></div>

    <div class="acts" style="margin-top:30px">
      <button class="btn ink" type="button" id="出简报">复制接班简报 → 粘给下一个会话</button>
      <button class="btn" type="button" id="出未定">只复制未定项</button>
      <button class="btn" type="button" onclick="window.print()">打印 / 存 PDF</button>
    </div>

    <div class="foot">
      这是渲染器，不是总结器。每天只重写 <code>&lt;script id="账"&gt;</code> 里的 JSON。<br>
      每一条都要能指回 <code>日志/YYYY-MM-DD.md</code> 里的一段原文；指不回去的删掉。<br>
      版面按忘记的代价排：未定 → 代签 → 别再试 → 不成文 → 流水 → 已定。已定的查得到，所以收在最后。
    </div>
  </div>
</div>

<div class="toast" id="toast">已复制</div>

<script>
(function(){
  var D = JSON.parse(document.getElementById('账').textContent);
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var 取 = function(k){ return D[k] || []; };
  var 今 = Date.parse(D.日期);
  function 账龄(起, 词){
    if(!起 || isNaN(今)) return '';
    var n = Math.round((今 - Date.parse(起)) / 864e5);
    if(!(n > 0)) return '';
    return '<span class="age'+(n >= 5 ? ' cold' : '')+'">'+词+' '+n+' 天</span>';
  }
  function 去向(g){
    if(!g) return '';
    var c = /全局/.test(g) ? ' up' : (/推翻|✕/.test(g) ? ' kill' : '');
    return '<span class="filed'+c+'">'+esc(g)+'</span>';
  }

  document.getElementById('项目').textContent = D.项目;
  document.getElementById('日期').innerHTML = esc(D.日期) + '<br>' + esc(D.时段 || '');
  document.getElementById('结余').textContent = D.结余 || D.一句话 || '';

  document.getElementById('计数').innerHTML = [
    ['未定', 取('未定').length, 'owe'],
    ['代签', 取('代签').length, 'owe'],
    ['攒下', 取('管用').length, 'gain'],
    ['别再试', 取('别再试').length, 'dim'],
    ['不成文', 取('不成文').length, 'dim'],
    ['已定', 取('已定').length, 'dim']
  ].map(function(x){ return '<div class="'+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'; }).join('');

  /* ——— 左栏：欠着的 ——— */
  var L = [];
  if(取('未定').length){
    L.push('<section data-both><h2 class="owe">未定 <em>忘了就重复讨论，或者被替你定掉</em></h2>');
    取('未定').forEach(function(u,i){
      L.push('<div class="entry open"><div class="head-row"><div class="t">'+esc(u.题)+'</div>'
        + 账龄(u.起于, '悬') + '</div>'
        + '<div class="forks">' + (u.岔路||[]).map(function(f,j){
            return '<div><b>'+String.fromCharCode(65+j)+'</b><span>'+esc(f)+'</span></div>'; }).join('') + '</div>'
        + '<p>卡在：'+esc(u.卡在)+'</p><span class="cost">'+esc(u.代价||'')+'</span>'
        + '<div class="acts"><button class="btn" type="button" data-copy="fork" data-i="'+i+'">复制成 prompt · 接着定</button></div></div>');
    });
    L.push('</section>');
  }
  if(取('代签').length){
    L.push('<section data-both><h2 class="owe">代签 <em>AI 提的、你只回了一个字，而它已经落地了</em></h2>');
    取('代签').forEach(function(b){
      L.push('<div class="entry signed"><div class="head-row"><div class="t">'+esc(b.事)+'</div>'
        + '<span class="stamp">代签 '+esc(b.时间||'')+'</span></div>'
        + (账龄(b.起于, '未补签') ? '<p>'+账龄(b.起于, '未补签')+'</p>' : '')
        + '<p>'+esc(b.谁定的)+'</p><p>依据：'+esc(b.依据)+'</p>'
        + (b.后果 ? '<p class="harm">后果：'+esc(b.后果)+'</p>' : '')
        + '<div class="acts"><button class="btn" type="button" data-ack>补签，认了</button>'
        + '<button class="btn" type="button" data-copy="undo" data-t="'+esc(b.事)+'">复制成 prompt · 推翻它</button></div></div>');
    });
    L.push('</section>');
  }

  /* ——— 右栏：立下的规矩 ——— */
  var R = [];
  if(取('管用').length){
    R.push('<section data-both><h2 class="gain">今天攒下的 <em>非显然、可迁移的做法，换个项目还成立</em></h2><ul class="ledger">');
    取('管用').forEach(function(g,i){
      R.push('<li><span class="no">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(g.做法)
        + '<span class="gain-in">替代了：'+esc(g.替代)+'</span>' + 去向(g.归档) + '</span></li>');
    });
    R.push('</ul></section>');
  }
  if(取('别再试').length){
    R.push('<section data-both><h2>别再试 <em>忘了会原样重做一遍，最贵的一类</em></h2><ul class="ledger">');
    取('别再试').forEach(function(r,i){
      R.push('<li><span class="no">'+String(i+1).padStart(2,'0')+'</span><span>'
        + '<span class="did">'+esc(r.试过)+'</span> → '+esc(r.结果)
        + '<span class="rule-out">✕ '+esc(r.别再)+'</span>' + 去向(r.归档) + '</span></li>');
    });
    R.push('</ul></section>');
  }
  if(取('不成文').length){
    R.push('<section data-both><h2>不成文的规矩 <em>过程中立下、贯穿全程，没写进任何文件，也没被你审过</em></h2><ul class="ledger">');
    取('不成文').forEach(function(c){
      R.push('<li><span class="no">§</span><span>'+esc(c.条)+'<span class="src">'+esc(c.出处)+'</span>'+去向(c.归档)+'</span></li>');
    });
    R.push('</ul></section>');
  }

  var H = ['<div class="cols"><div>'+L.join('')+'</div><div>'+R.join('')+'</div></div>'];

  /* ——— 流水：位置编码顺序，红弧揭示「后面推翻前面」 ——— */
  var ev = 取('时间轴');
  if(ev.length){
    var W = 1080, M = 62, Y = 104;
    var mins = function(s){ var p = String(s).split(':'); return (+p[0])*60 + (+p[1]); };
    var 有时 = ev.every(function(e){ return /^\d{1,2}:\d{2}$/.test(e.时); });
    var idx = {}; ev.forEach(function(e,i){ idx[e.时] = i; });
    var t0 = 有时 ? mins(ev[0].时) : 0, t1 = 有时 ? mins(ev[ev.length-1].时) : ev.length-1;
    var X = function(s){ var v = 有时 ? mins(s) : (idx[s]||0);
      return M + (v-t0)/Math.max(1,(t1-t0)) * (W-2*M); };
    var C = { '定':'var(--olive)', '翻':'var(--blue)', '代':'var(--red)', '坑':'var(--ink3)', '悬':'var(--amber)', '攒':'var(--gain)' };
    var s = ['<svg class="flow" viewBox="0 0 '+W+' 196" role="img" aria-label="今日流水">'];
    s.push('<line x1="'+M+'" y1="'+Y+'" x2="'+(W-M)+'" y2="'+Y+'" stroke="var(--ink)" stroke-width="1"/>');
    ev.forEach(function(e){
      if(!e.覆盖) return;
      var a = X(e.覆盖), b = X(e.时);
      s.push('<path d="M'+a+' '+(Y-7)+' Q'+((a+b)/2)+' '+(Y-62)+' '+b+' '+(Y-7)+'" fill="none" stroke="var(--blue)" stroke-width="1" stroke-dasharray="4 3"/>');
      s.push('<text class="ev" x="'+((a+b)/2)+'" y="'+(Y-52)+'" text-anchor="middle" fill="var(--blue)">推翻了「'+esc(e.覆盖)+'」</text>');
    });
    ev.forEach(function(e,i){
      var x = X(e.时), c = C[e.类] || 'var(--ink3)', 空 = (e.类==='悬');
      s.push('<rect x="'+(x-4.5)+'" y="'+(Y-4.5)+'" width="9" height="9" fill="'+(空?'var(--paper)':c)+'" stroke="'+c+'" stroke-width="1.6"'+(空?' stroke-dasharray="2 2"':'')+'/>');
      var y = (i%2===0) ? Y+25 : Y+60;
      s.push('<line x1="'+x+'" y1="'+(Y+6)+'" x2="'+x+'" y2="'+(y-13)+'" stroke="var(--rule)" stroke-width="1"/>');
      s.push('<text x="'+x+'" y="'+y+'" text-anchor="middle">'+esc(e.时)+'</text>');
      s.push('<text class="ev" x="'+x+'" y="'+(y+16)+'" text-anchor="middle">'+esc(e.事)+'</text>');
    });
    s.push('</svg>');
    H.push('<section data-only="日终"><h2>今日流水 <em>只看最终状态，看不出你中途改过主意</em></h2>' + s.join('')
      + '<div class="key">'
      + '<span><i style="background:var(--olive)"></i>定下</span>'
      + '<span><i style="background:var(--blue)"></i>推翻前面</span>'
      + '<span><i style="background:var(--red)"></i>代签</span>'
      + '<span><i style="background:var(--ink3)"></i>踩坑</span>'
      + '<span><i style="border:1.6px dashed var(--amber)"></i>悬着</span>'
      + '<span><i style="background:var(--gain)"></i>攒下</span></div></section>');
  }

  if(取('已定').length){
    H.push('<section data-only="日终"><details><summary>已定 '+取('已定').length+' 条 · 查得到，所以不占版面</summary><ul class="ledger">');
    取('已定').forEach(function(d,i){
      H.push('<li><span class="no">'+String(i+1).padStart(2,'0')+'</span><span>'+esc(d.事)
        + '<span class="why">因为：'+esc(d.因为)+'</span></span></li>');
    });
    H.push('</ul></details></section>');
  }

  if(D.下一步){
    H.push('<section data-both><h2>下一步</h2><div class="next">'+esc(D.下一步)+'</div></section>');
  }

  document.getElementById('正文').innerHTML = H.join('');

  /* 视角切换：开场只留不看会出错的 */
  document.querySelectorAll('.views button').forEach(function(b){
    b.addEventListener('click', function(){
      var v = b.dataset.view;
      document.querySelectorAll('.views button').forEach(function(o){ o.setAttribute('aria-pressed', String(o===b)); });
      document.querySelectorAll('[data-only]').forEach(function(el){
        el.style.display = (el.dataset.only === v) ? '' : 'none'; });
    });
  });

  /* 回流出口 */
  var toast = document.getElementById('toast');
  function copy(t){ navigator.clipboard.writeText(t).then(function(){
    toast.style.display='block'; setTimeout(function(){ toast.style.display='none'; }, 1400); }); }
  function 简报(){
    var L = ['# 接班简报 · ' + D.项目 + ' · ' + D.日期, '', (D.结余||D.一句话||''), ''];
    if(取('未定').length){ L.push('## 还没定的，先定这些');
      取('未定').forEach(function(u){ L.push('- ' + u.题 + '｜岔路：' + (u.岔路||[]).join(' / ') + '｜卡在：' + u.卡在); }); L.push(''); }
    if(取('代签').length){ L.push('## 是你替我定的，不是我定的');
      取('代签').forEach(function(b){ L.push('- ' + b.事 + '（依据：' + b.依据 + '）' + (b.后果 ? '｜风险：' + b.后果 : '')); }); L.push(''); }
    if(取('管用').length){ L.push('## 管用的做法，直接用');
      取('管用').forEach(function(g){ L.push('- ' + g.做法); }); L.push(''); }
    if(取('别再试').length){ L.push('## 试过不行，别再走');
      取('别再试').forEach(function(r){ L.push('- ' + r.试过 + ' → ' + r.结果 + '。' + r.别再); }); L.push(''); }
    if(取('不成文').length){ L.push('## 这个项目的规矩');
      取('不成文').forEach(function(c){ L.push('- ' + c.条); }); L.push(''); }
    if(D.下一步){ L.push('## 下一步', D.下一步); }
    return L.join('\n');
  }
  document.getElementById('出简报').addEventListener('click', function(){ copy(简报()); });
  document.getElementById('出未定').addEventListener('click', function(){
    copy(取('未定').map(function(u){ return '- ' + u.题 + '：' + (u.岔路||[]).join(' / '); }).join('\n')); });
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-copy]');
    if(b){
      if(b.dataset.copy === 'fork'){
        var u = D.未定[+b.dataset.i];
        copy('接着定这件事：' + u.题 + '\n岔路：' + (u.岔路||[]).join('　/　') + '\n卡在：' + u.卡在
          + '\n背景：' + (D.结余||'') + '\n先别写代码，帮我把这个决定推到底。');
      } else {
        copy('这条是你上次替我定的，我要重新看：' + b.dataset.t + '\n给我另外两种做法和各自的代价，再让我选。');
      }
    }
    var a = e.target.closest('[data-ack]');
    if(a){ var c = a.closest('.entry');
      c.classList.remove('signed'); c.style.opacity='.45';
      var st = c.querySelector('.stamp'); if(st){ st.style.color='var(--olive)'; st.style.borderColor='var(--olive)';
        st.style.boxShadow='0 0 0 1.5px var(--paper),0 0 0 2.5px rgba(76,91,58,.3)'; st.textContent='已补签'; }
      a.textContent='已补签'; a.disabled=true; }
  });
})();
</script>
