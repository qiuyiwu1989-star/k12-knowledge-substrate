<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>总账</title>
<!--
  对账 · 总账渲染器

  md 是账，html 是账的样子。
  账本.md 和 经验/ 是真身，这一页是它们的视图——每次日终整份重生成，不要手改这个文件。

  只重写下面 <script id="总账"> 里的 JSON。
-->
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAFAF6; --bar:#E9EEE2; --ink:#15191B; --ink2:#474E4C; --ink3:#7B827D;
    --rule:#C6CDBF; --red:#A32E22; --blue:#23557E; --olive:#4C5B3A; --amber:#8E6A12; --gain:#2F6D5B;
    --mono:'Space Mono',ui-monospace,Menlo,monospace;
    --sans:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;
    --serif:'Noto Serif SC',Songti SC,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.65}
  .sheet{max-width:1140px;margin:0 auto;padding:0 22px 90px 0;display:grid;grid-template-columns:36px 1fr}
  .bind{border-right:1px solid var(--rule);position:relative}
  .bind::before{content:'';position:absolute;top:0;bottom:0;right:5px;border-right:1px solid var(--rule)}
  .bind span{position:sticky;top:26px;display:block;writing-mode:vertical-rl;font-family:var(--mono);
    font-size:9.5px;letter-spacing:.34em;color:var(--ink3);padding:26px 0 0 9px}
  .body{padding-left:26px;min-width:0}

  .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.3em;color:var(--red);padding-top:30px}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;
    border-bottom:2px solid var(--ink);padding-bottom:12px;margin-top:4px}
  h1{font-family:var(--serif);font-size:27px;font-weight:600;margin:0}
  .when{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.55}

  .tally{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--ink);
    border-bottom:1px solid var(--ink);margin:22px 0 6px}
  .tally div{padding:11px 0 10px 14px;border-left:1px solid var(--rule)}
  .tally div:first-child{border-left:0;padding-left:0}
  .tally b{display:block;font-family:var(--mono);font-weight:700;font-size:31px;line-height:1;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .tally span{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;color:var(--ink3);display:block;margin-top:5px}
  .tally .owe b{color:var(--red)} .tally .gain b{color:var(--gain)} .tally .dim b{color:var(--ink3)}

  section{margin-top:36px}
  h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;margin:0 0 3px;color:var(--ink);
    border-bottom:1px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  h2 em{font-style:normal;font-family:var(--sans);font-size:12px;letter-spacing:0;color:var(--ink3);font-weight:400;text-align:right}
  h2.owe{color:var(--red);border-color:var(--red)}
  h2.gain{color:var(--gain);border-color:var(--gain)}

  /* 账本：账龄条 —— 越老越长，扫一眼就看见你在回避哪一个 */
  table{width:100%;border-collapse:collapse;margin-top:6px}
  tbody tr{border-bottom:1px solid var(--rule)}
  tbody tr:nth-child(odd){background:var(--bar)}
  td{padding:9px 10px 9px 8px;vertical-align:top;font-size:13.5px;line-height:1.55}
  td.aged{width:118px;padding-left:0}
  .agebar{display:block;height:7px;background:var(--red);min-width:2px;opacity:.85}
  .agebar.cool{background:var(--amber)}
  .agenum{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink2);display:block;margin-bottom:3px}
  .agenum.hot{color:var(--red);font-weight:700}
  td .sub{display:block;color:var(--ink3);font-size:12.5px;margin-top:3px}
  td.kind{width:44px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--red);padding-top:11px}
  td.kind.q{color:var(--amber)}

  /* 检索条 */
  .find{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
  .find input{flex:1 1 220px;font-family:var(--sans);font-size:13.5px;background:transparent;
    border:0;border-bottom:1px solid var(--ink);padding:7px 2px;color:var(--ink);min-width:0}
  .find input:focus{outline:0;border-bottom-width:2px}
  .find input::placeholder{color:var(--ink3)}
  .chip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;background:transparent;color:var(--ink3);
    border:1px solid var(--rule);padding:5px 10px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .hits{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3);margin-left:auto}

  /* 经验条目 */
  .topic{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink3);
    margin:24px 0 0;padding-bottom:5px;border-bottom:1px solid var(--rule)}
  .exp{display:flex;gap:14px;padding:12px 10px 13px 8px;border-bottom:1px solid var(--rule)}
  .exp:nth-of-type(even){background:var(--bar)}
  .exp .lv{flex:none;width:52px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink3);padding-top:3px}
  .exp .lv b{display:block;font-weight:400;color:var(--gain)}
  .exp .lv.proj b{color:var(--ink3)}
  .exp .m{min-width:0;flex:1}
  .exp .do{font-weight:500;font-size:14.5px;line-height:1.5}
  .exp .d{display:block;color:var(--ink2);font-size:13px;margin-top:4px}
  .exp .src{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink3);margin-top:6px;display:block}
  .exp .dots{flex:none;font-family:var(--mono);font-size:11px;color:var(--gain);letter-spacing:.14em;padding-top:4px;white-space:nowrap}
  .exp.limited{border-left:3px solid var(--amber);padding-left:11px}
  .exp.killed{border-left:3px solid var(--red);padding-left:11px}
  .exp.killed .do{text-decoration:line-through;text-decoration-color:var(--red);color:var(--ink3)}
  .exp.killed .dots{color:var(--ink3)}
  .flag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;display:block;margin-top:5px}
  .flag.limited{color:var(--amber)} .flag.killed{color:var(--red)}
  .exp.demo{border-left:3px dashed var(--blue);padding-left:11px}
  .exp.demo .do::after{content:' 〔样例 · 装好后删掉〕';font-family:var(--mono);font-size:9.5px;
    letter-spacing:.1em;color:var(--blue);font-weight:400}
  .none{color:var(--ink3);font-size:13px;padding:14px 0}

  .acts{display:flex;gap:9px;margin-top:26px;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;background:transparent;color:var(--ink2);
    border:1px solid var(--rule);padding:6px 12px;cursor:pointer}
  .btn:hover{border-color:var(--ink);color:var(--ink)}
  .btn.ink{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  details summary{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;color:var(--ink3);
    padding:10px 0;cursor:pointer;border-bottom:1px solid var(--rule);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:'▸ ';color:var(--olive)}
  details[open] summary::before{content:'▾ '}
  .foot{margin-top:50px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink3);max-width:64ch;line-height:1.75}
  .foot code{font-family:var(--mono);font-size:11.5px;color:var(--ink2)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:9px 17px;display:none}
  @media(max-width:820px){
    .sheet{grid-template-columns:20px 1fr;padding-right:16px} .body{padding-left:16px} .bind span{display:none}
    .tally{grid-template-columns:repeat(3,1fr)} .tally b{font-size:26px}
    .tally div{border-top:1px solid var(--rule);padding-left:12px}
    .tally div:nth-child(-n+3){border-top:0} .tally div:nth-child(4){border-left:0;padding-left:0}
    td.aged{width:78px}
  }
  @media print{ .find,.acts,.toast{display:none} body{background:#fff} details{display:block} }
</style>
</head>

<div class="sheet">
  <div class="bind"><span>总账 · LEDGER</span></div>
  <div class="body">
    <div class="eyebrow">未结的账 · 攒下的经验</div>
    <div class="top">
      <h1 id="项目"></h1>
      <div class="when" id="更新于"></div>
    </div>

    <div class="tally" id="计数"></div>
    <div id="正文"></div>

    <div class="foot">
      md 是账，这一页是账的样子。真身是 <code>账本.md</code> 和 <code>经验/</code>，每次日终整份重生成——<b>不要手改这个文件</b>。<br>
      账本会消：结清了就移进已结清。经验库会长，但靠合并长，不靠追加长。<br>
      账龄条是这页唯一需要盯的东西：悬一天正常，悬七天说明你在回避那个决定。
    </div>
  </div>
</div>
<div class="toast" id="toast">已复制</div>

<script>
(function(){
  var D = JSON.parse(document.getElementById('总账').textContent);
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var 账 = D.账本 || {}, 经 = D.经验 || [];
  var 未定 = 账.未定 || [], 代签 = 账.代签 || [], 已结 = 账.已结清 || [];
  var 今 = Date.parse(D.更新于);

  function 龄(起){ var n = Math.round((今 - Date.parse(起)) / 864e5); return isNaN(n) ? 0 : Math.max(0, n); }
  var 最老 = 0;
  未定.concat(代签).forEach(function(x){ 最老 = Math.max(最老, 龄(x.起于)); });

  document.getElementById('项目').textContent = D.项目;
  document.getElementById('更新于').innerHTML = '更新于 ' + esc(D.更新于) + '<br>' + esc(D.范围 || '');
  document.getElementById('计数').innerHTML = [
    ['未结的账', 未定.length + 代签.length, 'owe'],
    ['最老 · 天', 最老, 最老 >= 5 ? 'owe' : 'dim'],
    ['经验条目', 经.filter(function(e){ return e.状态 !== '已被推翻'; }).length, 'gain'],
    ['其中全局', 经.filter(function(e){ return e.层级 === '全局' && e.状态 !== '已被推翻'; }).length, 'gain'],
    ['已被推翻', 经.filter(function(e){ return e.状态 === '已被推翻'; }).length, 'dim']
  ].map(function(x){ return '<div class="'+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'; }).join('');

  var H = [];

  /* ——— 账本：按账龄降序，最老的顶在最上面 ——— */
  var 行 = 未定.map(function(u){ return {类:'未定', 题:u.题, 副:'卡在：'+(u.卡在||''), 起:u.起于}; })
    .concat(代签.map(function(b){ return {类:'代签', 题:b.事, 副:(b.后果 ? '后果：'+b.后果 : b.依据||''), 起:b.起于}; }))
    .sort(function(a,b){ return 龄(b.起) - 龄(a.起); });

  H.push('<section><h2 class="owe">未结的账 <em>按账龄排，最老的顶在上面</em></h2>');
  if(!行.length){ H.push('<div class="none">账清了。</div>'); }
  else {
    H.push('<table><tbody>');
    行.forEach(function(r){
      var n = 龄(r.起), w = 最老 ? Math.max(2, Math.round(n / 最老 * 100)) : 2;
      H.push('<tr><td class="kind'+(r.类==='未定'?' q':'')+'">'+r.类+'</td>'
        + '<td class="aged"><span class="agenum'+(n>=5?' hot':'')+'">'+(n ? '悬 '+n+' 天' : '今天')+'</span>'
        + '<i class="agebar'+(n<5?' cool':'')+'" style="width:'+w+'%"></i></td>'
        + '<td>'+esc(r.题)+'<span class="sub">'+esc(r.副)+'　·　起于 '+esc(r.起)+'</span></td></tr>');
    });
    H.push('</tbody></table>');
  }
  if(已结.length){
    H.push('<details><summary>已结清 '+已结.length+' 条 · 留档，为了查「当初为什么这么定」</summary><table><tbody>');
    已结.forEach(function(x){
      H.push('<tr><td>'+esc(x.事)+'<span class="sub">'+esc(x.怎么结的||'')+'　·　'
        + esc(x.起于)+' → '+esc(x.结于)+'</span></td></tr>');
    });
    H.push('</tbody></table></details>');
  }
  H.push('</section>');

  /* ——— 经验库 ——— */
  H.push('<section><h2 class="gain">经验库 <em>靠合并长，不靠追加长。点数=被重复验证的次数</em></h2>'
    + '<div class="find">'
    + '<input id="q" type="search" placeholder="搜做法、场景、主题……">'
    + '<button class="chip" type="button" data-f="全部" aria-pressed="true">全部</button>'
    + '<button class="chip" type="button" data-f="全局" aria-pressed="false">只看全局</button>'
    + '<button class="chip" type="button" data-f="失效" aria-pressed="false">被限定/推翻</button>'
    + '<span class="hits" id="hits"></span></div><div id="库"></div></section>');

  H.push('<div class="acts">'
    + '<button class="btn ink" type="button" id="出选中">复制筛选出的条目 → 粘给这个会话</button>'
    + '<button class="btn" type="button" onclick="window.print()">打印 / 存 PDF</button></div>');

  document.getElementById('正文').innerHTML = H.join('');

  /* 渲染经验库，按主题分组 */
  var 当前 = '全部', 词 = '';
  function 命中(e){
    if(当前 === '全局' && e.层级 !== '全局') return false;
    if(当前 === '失效' && !e.状态) return false;
    if(!词) return true;
    return [e.做法, e.何时用, e.替代, e.主题, e.备注].join(' ').toLowerCase().indexOf(词) >= 0;
  }
  function 画(){
    var 中 = 经.filter(命中), out = [], 上 = null;
    中.forEach(function(e){
      if(e.主题 !== 上){ out.push('<div class="topic">'+esc(e.主题)+'</div>'); 上 = e.主题; }
      var cls = 'exp' + (e.状态 === '已被推翻' ? ' killed' : e.状态 === '已被限定' ? ' limited' : '') + (e.样例 ? ' demo' : '');
      var n = e.强度 || 1;
      out.push('<div class="'+cls+'">'
        + '<div class="lv'+(e.层级!=='全局'?' proj':'')+'"><b>'+esc(e.层级||'项目')+'</b>库</div>'
        + '<div class="m"><div class="do">'+esc(e.做法)+'</div>'
        + (e.何时用 ? '<span class="d">什么时候用：'+esc(e.何时用)+'</span>' : '')
        + (e.替代 ? '<span class="d">它替代了：'+esc(e.替代)+'</span>' : '')
        + (e.状态 ? '<span class="flag '+(e.状态==='已被推翻'?'killed':'limited')+'">'+esc(e.状态)+'：'+esc(e.备注||'')+'</span>' : '')
        + '<span class="src">'+(e.来源||[]).map(function(s){ return esc(s); }).join('　·　')+'</span></div>'
        + '<div class="dots" title="被验证 '+n+' 次">'+'▪'.repeat(Math.min(n,5))+'▫'.repeat(Math.max(0,5-n))+'</div></div>');
    });
    document.getElementById('库').innerHTML = out.join('') || '<div class="none">没有命中的条目。</div>';
    document.getElementById('hits').textContent = 中.length + ' / ' + 经.length;
  }
  经.sort(function(a,b){ return (a.主题||'').localeCompare(b.主题||'') || (b.强度||1) - (a.强度||1); });
  画();

  document.getElementById('q').addEventListener('input', function(e){ 词 = e.target.value.trim().toLowerCase(); 画(); });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){
      当前 = c.dataset.f;
      document.querySelectorAll('.chip').forEach(function(o){ o.setAttribute('aria-pressed', String(o === c)); });
      画();
    });
  });

  var toast = document.getElementById('toast');
  document.getElementById('出选中').addEventListener('click', function(){
    var 中 = 经.filter(命中);
    var t = ['# 这个项目已经攒下的经验（' + 中.length + ' 条）', ''];
    中.forEach(function(e){
      t.push('- ' + e.做法 + (e.状态 ? '〔' + e.状态 + '：' + (e.备注||'') + '〕' : ''));
    });
    t.push('', '动手前先对一遍，别重走已经走不通的路。');
    navigator.clipboard.writeText(t.join('\n')).then(function(){
      toast.style.display='block'; setTimeout(function(){ toast.style.display='none'; }, 1400); });
  });
})();
</script>
</body>
</html>
