# k12.yongle.school —— 放到 /etc/nginx/sites-available/ 并软链到 sites-enabled/
# HTTPS 由 certbot --nginx 自动追加，不要手写 ssl_ 段。
server {
    listen 80;
    listen [::]:80;
    server_name k12.yongle.school;
    root /var/www/k12.yongle.school;
    index index.html;

    access_log /var/log/nginx/k12.yongle.school.access.log;
    error_log  /var/log/nginx/k12.yongle.school.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json application/x-ndjson;

    # 图谱页 460KB+，gzip 后约 1/15（实测 478KB → 32KB）。
    # HTML 不长缓存，数据一更新就能看到。
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # 数据集允许跨域直取 —— 这是开放数据的意义，别人不用 clone 就能用
    location /data/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        types { application/x-ndjson jsonl; application/json json; }
        try_files $uri =404;
        autoindex on;
    }

    location ~ /\.(?!well-known) { deny all; }
}

# www 一律 301 到主域。DNS 上 *.yongle.school 是泛解析，www.k12 也会打到这台机器；
# 没有对应 server_name 时 nginx 拿默认站点应答 → 浏览器收到**别的域名的证书** → 报证书无效。
# 这个坑只有从外网用带 www 的地址访问才会暴露，本机 curl 测不出来。
server {
    listen 80;
    listen [::]:80;
    server_name www.k12.yongle.school;
    return 301 https://k12.yongle.school$request_uri;
}
