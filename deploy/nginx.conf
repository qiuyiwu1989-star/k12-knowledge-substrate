# k12.yongle.school 的 nginx 配置。
#
# ⚠️ **这份是从服务器上取回来的实际配置，不是「应该长什么样」的模板。**
#
# 2026-08-19 出过一次事故：仓库里这份只有 80 端口，443 段和证书路径是 certbot
# 后来直接加在服务器上的、**从没同步回仓库**。我拿仓库版整文件覆盖上去，
# 443 段整个消失 —— 站点对外返回的是同机另一个域名（ai.yongle.school）的证书，
# 浏览器直接拒绝连接。整站不可用约三分钟。
#
# 两条教训：
#   1. **改线上配置不要整文件覆盖**，只改需要改的那一行（sed/python 就地改）。
#      整文件覆盖的前提是「仓库版是权威版」，而只要有 certbot 这类工具直接改过
#      服务器，这个前提就已经不成立了。
#   2. **改完必须从外网验**，不能只看 `nginx -t` 和 `systemctl reload` 的返回。
#      那两个当时都是成功的 —— 语法没错、进程也活着，错的是证书对不上域名。
#      服务器本机 curl 也是 200（本机不校验证书），只有外网才看得出来。
#
# 改动前先 `sudo cp` 一份到 /tmp，回滚只有一句 cp 才叫有把握。

# k12.yongle.school —— K12 知识底座 · 能力图谱（纯静态）
server {
    server_name k12.yongle.school;
    root /var/www/k12.yongle.school;
    index index.html;

    access_log /var/log/nginx/k12.yongle.school.access.log;
    error_log  /var/log/nginx/k12.yongle.school.error.log;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json application/x-ndjson;

    # 图谱页 450KB+，gzip 后约 1/4；HTML 不长缓存，便于随时更新数据
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    # 数据集：JSONL 直接可取，允许跨域（这是开放数据的意义）
    location /data/ {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
        types { application/x-ndjson jsonl; application/json json; }
        try_files $uri $uri/index.html =404;
        autoindex on;
    }

    location ~ /\.(?!well-known) { deny all; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/k12.yongle.school/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/k12.yongle.school/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = k12.yongle.school) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name k12.yongle.school;
    return 404; # managed by Certbot


}

# www 一律 301 到主域。DNS 上 *.yongle.school 是泛解析，www.k12 也会打到这台机器；
# 没有对应 server_name 时 nginx 拿默认站点应答 → 浏览器收到别的域名的证书 → 报证书无效。
server {
    server_name www.k12.yongle.school;
    return 301 https://k12.yongle.school$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/k12.yongle.school/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/k12.yongle.school/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.k12.yongle.school) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.k12.yongle.school;
    return 404; # managed by Certbot


}